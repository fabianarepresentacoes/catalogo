# Gera automaticamente as miniaturas leves (pasta "miniaturas/") sempre que
# fotos novas forem enviadas para a pasta "imagens/". Não precisa fazer nada manual.
name: Gerar miniaturas
on:
  push:
    branches: [main]
    paths: ['imagens/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: miniaturas
  cancel-in-progress: false
jobs:
  miniaturas:
    # Versão fixa do servidor (o "ubuntu-latest" está mudando para Ubuntu 26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Python próprio e fixo: o pip instala no MESMO Python que roda o script
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pillow
      - name: Criar miniaturas que faltam
        run: python .github/scripts/thumbs.py imagens miniaturas
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add miniaturas
          if git diff --cached --quiet; then echo "Nenhuma miniatura nova."; exit 0; fi
          git commit -m "Miniaturas automáticas"
          # Se alguém enviou outra alteração enquanto rodava, junta antes de enviar
          git pull --rebase origin main
          git push
