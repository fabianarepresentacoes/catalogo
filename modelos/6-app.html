<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Modelo 6 · App | Fabiana Representações</title>
<link rel="icon" href="img/fr-emblema.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="motor.css">
<style>
  :root {
    --bg: #F7F5F1; --surface: #FFFFFF; --surface-2: #F1EEE8; --stage: #FFFFFF;
    --text: #1C1A17; --muted: #7D776E; --line: #ECE8E1;
    --accent: #9B761D; --accent-2: #7F6015; --on-accent: #fff; --soft: #F6EEDC;
    --radius: 22px; --radius-sm: 14px;
    --font-head: 'Fraunces', Georgia, serif; --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --brand-h: 44px; --brand-fs: 16px;
  }
  html.dark { --bg: #121110; --surface: #1C1A18; --surface-2: #262320; --stage: #F2EEE8; --text: #F2EFEA; --muted: #A59F96; --line: #2D2A26; --accent: #DDB967; --accent-2: #ECCB80; --on-accent: #161412; --soft: #2A2419; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 22px; }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } body { --demo-bottom: 150px; } }

  header.main { padding: 16px 0 6px; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hact { display: flex; gap: 8px; }
  .circ { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; position: relative; text-decoration: none; }
  .circ [data-cart-count] { position: absolute; top: -3px; right: -3px; background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 800; min-width: 19px; height: 19px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .circ [data-cart-count].is-zero { display: none; }
  html.dark .fa-moon, html:not(.dark) .fa-sun { display: none; }
  .hello { margin: 22px 0 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .hello h1 { font-family: var(--font-head); font-weight: 500; font-size: clamp(30px, 4.4vw, 50px); line-height: 1.08; margin: 0; max-width: 640px; }
  .hello h1 span { color: var(--accent); }
  .hello p { margin: 8px 0 0; color: var(--muted); }
  .search { position: relative; flex: 1; min-width: 280px; max-width: 460px; }
  .search input { width: 100%; height: 56px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 56px 0 52px; font-size: 15.5px; outline: none; box-shadow: 0 10px 30px -18px rgba(0,0,0,.25); color: var(--text); }
  .search input:focus { border-color: var(--accent); }
  .search > i { position: absolute; left: 21px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search .fbtn { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--text); color: var(--surface); }
  @media (max-width: 640px) { .hello { margin: 16px 0 12px; } .search { min-width: 100%; } }

  .chips-wrap { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); padding: 10px 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .cat { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px 8px 8px; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .chips .cat .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .chips .cat.is-on { background: var(--text); color: var(--surface); border-color: var(--text); }
  .chips .cat.is-on .ic { background: var(--accent); color: var(--on-accent); }
  .chips .cat-n { display: none; }

  .feature { margin: 16px 0 26px; }
  .feature h2, .sec h2 { font-size: 20px; font-weight: 800; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; letter-spacing: -.01em; }
  .feature h2 small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .frail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 32%); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
  .frail::-webkit-scrollbar { display: none; }
  .fcard { scroll-snap-align: start; border-radius: var(--radius); background: var(--soft); display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 18px; gap: 10px; min-height: 190px; cursor: pointer; border: 0; text-align: left; color: var(--text); }
  .fcard:nth-child(3n+2) { background: color-mix(in srgb, #9DB4A0 25%, var(--surface)); }
  .fcard:nth-child(3n+3) { background: color-mix(in srgb, #C9B6A0 30%, var(--surface)); }
  .fcard small { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .fcard b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.3; margin: 6px 0 10px; }
  .fcard .fp { font-weight: 800; font-size: 18px; }
  .fcard .fi { aspect-ratio: 1; border-radius: 18px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .fcard .fi img { width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; }
  @media (max-width: 640px) { .frail { grid-auto-columns: 84%; } }

  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sec-h h2 { margin: 0; }
  .sec-h [data-count] { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 8px; }
  @media (max-width: 640px) { .sec-h h2 { font-size: 18px; flex-direction: column; align-items: flex-start; } .sec-h [data-count] { margin: 2px 0 0; } }
  .sortsel { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 38px; padding: 0 12px; font-size: 13px; font-weight: 700; color: var(--text); outline: none; }
  [data-applied] { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-bottom: 40px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .card { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .cm { position: relative; aspect-ratio: 1; border-radius: var(--radius); background: var(--stage); overflow: hidden; cursor: pointer; border: 1px solid var(--line); }
  .cm img { width: 100%; height: 100%; object-fit: contain; padding: 12%; mix-blend-mode: multiply; transition: transform .5s; }
  .card:hover .cm img { transform: scale(1.05); }
  .plus { position: absolute; right: 10px; bottom: 10px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--text); color: var(--surface); font-size: 16px; box-shadow: 0 8px 18px -6px rgba(0,0,0,.4); transition: transform .15s; }
  html.dark .plus { background: #1C1A17; color: #fff; }
  .plus:active { transform: scale(.9); }
  .badge { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.92); color: #1C1A17; font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 999px; }
  .badge.hot { background: #1C1A17; color: #F0D28A; }
  .ci { padding: 0 4px; display: flex; flex-direction: column; gap: 4px; }
  .ci h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .ci .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .ci .pp { font-weight: 800; font-size: 16.5px; }
  .ci .pp small { font-weight: 600; font-size: 11px; color: var(--muted); }
  .more { text-align: center; margin: 10px 0 30px; }
  .more button, .empty button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 12px 24px; font-weight: 700; color: var(--text); }
  .empty { text-align: center; padding: 50px 0; color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0 150px; }
  footer .brand { justify-content: center; margin-bottom: 8px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  .cartbar { pointer-events: auto; max-width: 560px; margin: 0 auto 8px; background: var(--accent); color: var(--on-accent); border-radius: 18px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border: 0; width: 100%; transform: translateY(20px); opacity: 0; pointer-events: none; transition: all .3s; box-shadow: 0 14px 30px -12px rgba(0,0,0,.4); text-align: left; }
  .cartbar.is-on { transform: none; opacity: 1; pointer-events: auto; }
  .cartbar small { display: block; font-size: 12px; opacity: .85; }
  .cartbar b { font-size: 17px; }
  .cartbar .go { margin-left: auto; background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 14px; }
  .tabbar { pointer-events: auto; max-width: 560px; margin: 0 auto; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; box-shadow: 0 14px 40px -16px rgba(0,0,0,.35); }
  .tabbar button, .tabbar a { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 0; border-radius: 16px; text-decoration: none; position: relative; }
  .tabbar i { font-size: 18px; }
  .tabbar .on { color: var(--text); background: var(--surface-2); }
  .tabbar [data-cart-count] { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--accent); color: var(--on-accent); font-size: 10px; min-width: 17px; height: 17px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .tabbar [data-cart-count].is-zero { display: none; }
  @media (min-width: 900px) { .tabbar { display: none; } .cartbar { max-width: 420px; margin-right: 20px; margin-left: auto; } footer { padding-bottom: 120px; } }

  .sheet { position: fixed; inset: 0; z-index: 85; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; display: flex; align-items: flex-end; justify-content: center; }
  .sheet.is-open { opacity: 1; pointer-events: auto; }
  .sheet > div { background: var(--surface); width: min(640px, 100%); border-radius: 24px 24px 0 0; padding: 10px 18px 30px; max-height: 80vh; overflow: auto; transform: translateY(30px); transition: transform .3s; }
  .sheet.is-open > div { transform: none; }
  .sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; }
  .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sgrid .cat { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text); text-align: center; }
  .sgrid .cat .si { width: 100%; aspect-ratio: 1.3; border-radius: 12px; background: var(--stage); display: flex; align-items: center; justify-content: center; }
  .sgrid .cat .si img { width: 64%; height: 80%; object-fit: contain; mix-blend-mode: multiply; }
  .sgrid .cat .si i { font-size: 22px; color: var(--accent); }
  .sgrid .cat.is-on { border-color: var(--accent); color: var(--accent); }
  .sgrid .cat-n { color: var(--muted); font-weight: 600; font-size: 11px; }
</style>
</head>
<body>
  <header class="main"><div class="wrap">
    <div class="hrow">
      <a href="./6-app.html" class="brand" data-brand aria-label="Início"></a>
      <div class="hact">
        <button class="circ" data-theme-toggle aria-label="Trocar tema"><i class="fa-regular fa-moon"></i><i class="fa-regular fa-sun"></i></button>
        <a class="circ" href="https://wa.me/5511959781849" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        <button class="circ" data-open-cart aria-label="Orçamento"><i class="fa-solid fa-bag-shopping"></i><span data-cart-count>0</span></button>
      </div>
    </div>
    <div class="hello">
      <div><h1>O que vamos <span>iluminar</span> hoje?</h1><p>Escolha os produtos e envie seu orçamento em segundos.</p></div>
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" data-search id="q" placeholder="Pendente, spot, código..."><button type="button" class="fbtn" onclick="openSheet()" aria-label="Categorias"><i class="fa-solid fa-sliders"></i></button></label>
    </div>
  </div></header>

  <div class="chips-wrap"><div class="wrap"><div class="chips" data-cats="chip" data-drag></div></div></div>

  <main class="wrap">
    <section class="feature"><h2>Destaques da semana <small>deslize →</small></h2><div class="frail" data-frail><div class="skel" data-skeleton style="height:190px"></div><div class="skel" data-skeleton style="height:190px"></div></div></section>
    <section class="sec" data-results>
      <div class="sec-h"><h2><span data-cat-title="Todos os produtos">Todos os produtos</span><span data-count></span></h2>
        <select class="sortsel" data-sort aria-label="Ordenar"><option value="default">Destaques</option><option value="new">Novidades</option><option value="priceAsc">Menor preço</option><option value="priceDesc">Maior preço</option></select></div>
      <div data-applied hidden></div>
      <div class="grid" data-grid><div class="skel" data-skeleton style="height:280px"></div><div class="skel" data-skeleton style="height:280px"></div></div>
      <div class="empty" data-empty hidden><p>Nada encontrado.</p><button data-reset>Ver tudo</button></div>
      <div class="more" data-more hidden><button data-more-btn>Mostrar mais</button></div>
    </section>
  </main>
  <footer><a href="./6-app.html" class="brand" data-brand></a>© <span data-year></span> Fabiana Representações · (11) 95978-1849</footer>

  <div class="bottom">
    <button class="cartbar" data-cart-bar data-open-cart><span><small><span data-cart-lines>0 itens</span> no orçamento</small><b data-cart-total>R$ 0,00</b></span><span class="go">Ver orçamento <i class="fa-solid fa-arrow-right"></i></span></button>
    <nav class="tabbar">
      <button class="on" data-scroll-top><i class="fa-solid fa-house"></i>Início</button>
      <button onclick="openSheet()"><i class="fa-solid fa-table-cells-large"></i>Categorias</button>
      <button onclick="window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>document.getElementById('q').focus(),350)"><i class="fa-solid fa-magnifying-glass"></i>Buscar</button>
      <button data-open-cart><i class="fa-solid fa-bag-shopping"></i>Orçamento<span data-cart-count>0</span></button>
    </nav>
  </div>
  <div class="sheet" onclick="if(event.target===this||event.target.closest('[data-cat]'))this.classList.remove('is-open')"><div><div class="grab"></div><h3>Categorias</h3><div class="sgrid" data-cats="sheet"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="motor.js"></script>
<script>
function openSheet() { document.querySelector('.sheet').classList.add('is-open'); document.querySelectorAll('.sgrid img[data-catimg]').forEach(i => { if (!i.src) i.src = Motor.catImage(i.dataset.catimg); }); }
Motor.init({
  id: '6-app', logo: 'duo', scrollOnCat: 'always',
  headerOffset: () => 70,
  catTemplates: {
    chip: (c, n, on, icon) => `<button class="cat" data-cat="${Motor.H.esc(c)}"><span class="ic"><i class="${c === 'Todos' ? 'fa-solid fa-border-all' : icon}"></i></span>${Motor.H.esc(c === 'Todos' ? 'Tudo' : c)}</button>`,
    sheet: (c, n, on, icon) => `<button class="cat" data-cat="${Motor.H.esc(c)}"><span class="si">${c === 'Todos' ? '<i class="fa-solid fa-border-all"></i>' : `<img data-catimg="${Motor.H.esc(c)}" alt="">`}</span>${Motor.H.esc(c === 'Todos' ? 'Ver tudo' : c)}<span class="cat-n">${n}</span></button>`
  },
  card: (it, H) => `
    <article class="card">
      <div class="cm" data-open="${H.esc(it.code)}">${H.img(it)}
        ${it.featured ? '<span class="badge hot">★ Top</span>' : it.isNew ? '<span class="badge">Novo</span>' : it.isGroup ? `<span class="badge">${H.options(it)}</span>` : ''}
        <button class="plus" data-add="${H.esc(it.code)}" aria-label="Adicionar"><i class="fa-solid ${it.isGroup ? 'fa-palette' : 'fa-plus'}"></i></button>
      </div>
      <div class="ci">
        <h3 data-open="${H.esc(it.code)}">${H.esc(it.name)}</h3>
        <span class="sub">${it.isGroup ? H.swatches(it, 11) : ''}${H.esc(it.isGroup ? (it.temps.join(' · ') || it.category) : it.code)}</span>
        ${H.team(it)}
        <span class="pp">${H.from(it) ? '<small>a partir de </small>' : ''}${H.priceLabel(it.price)}</span>
      </div>
    </article>`,
  onReady(M) {
    const H = M.H, f = M.featured(10);
    document.querySelector('[data-frail]').innerHTML = (f.length ? f : M.state.items.slice(0, 8)).map(it => `
      <button class="fcard" data-open="${H.esc(it.code)}"><span><small>${H.esc(it.category)}</small><b>${H.esc(it.name)}</b><span class="fp">${H.from(it) ? '<small style="font-size:11px;color:inherit;opacity:.7;letter-spacing:0;text-transform:none">a partir de </small>' : ''}${H.priceLabel(it.price)}</span></span><span class="fi">${H.img(it)}</span></button>`).join('');
    document.querySelector('[data-year]').textContent = new Date().getFullYear();
  }
});
</script>
</body>
</html>
